<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battle Tower Solver</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-header">
  <h1>Battle Tower Solver</h1>
  <span class="seg level-seg" role="group" aria-label="Level" title="Level 100: Open Level with a level-100 team. Every Pokémon on both sides is level 100, and Dragonite, Tyranitar and the legendary birds' and beasts' 5th-6th sets can appear. The trainers are the same.">
    <input type="radio" name="level" value="50" id="level50" class="trigger" checked /><label for="level50" class="btn">Level 50</label>
    <input type="radio" name="level" value="100" id="level100" class="trigger" /><label for="level100" class="btn">Level 100</label>
  </span>
</header>

<main class="layout">

  <!-- ───────────────────────── YOUR TEAM ───────────────────────── -->
  <section class="panel" id="teamPanel" aria-label="Your team">
    <h2>Your team</h2>
    <div class="field-row">
      <label for="savedTeams">Saved</label>
      <select id="savedTeams"><option value="">— Select a saved team —</option></select>
      <button id="deleteTeam" class="btn btn-small" title="Delete the selected saved team">✕</button>
    </div>
    <textarea id="teamText" placeholder="Paste your team (Showdown export, up to 3 Pokémon)"></textarea>
    <div class="btn-row">
      <button id="parseTeam" class="btn btn-primary">Use team</button>
      <input type="text" id="teamName" placeholder="Name to save as" />
      <button id="saveTeam" class="btn">Save</button>
    </div>
    <div id="teamError" class="error-display"></div>

    <div id="monCards"></div>

    <div id="activeBlock" class="active-block" hidden>
      <h3>Out now: <span id="activeName"></span></h3>
      <div class="field-row">
        <input type="checkbox" id="youFirstTurn" class="trigger" checked /><label for="youFirstTurn" class="chk-label" title="It came in this turn or at the start of the battle: it has used no move yet.">Just came in</label>
      </div>
      <div class="field-row" id="lastMoveRow">
        <label for="youLastMove" title="The move it used last turn. The AI records it, and if it hit, the opponent may switch to a teammate it would not have hurt.">Last move</label>
        <select id="youLastMove" class="trigger"></select>
        <input type="checkbox" id="youLanded" class="trigger" checked /><label for="youLanded" class="chk-label">It hit</label>
      </div>
      <div class="field-row" id="seenRow">
        <label title="Moves this Pokémon has used since it came in. The AI only knows these, not your whole moveset.">AI has seen</label>
        <div id="youSeen" class="seen-moves"></div>
      </div>
      <div class="field-row">
        <label title="Leave all at 0 at the start of a battle: switch-in effects such as Intimidate are applied for you.">Stages</label>
        <div class="stage-grid" id="youStages"></div>
      </div>
      <div class="field-row">
        <label for="youConfused">Confused</label>
        <select id="youConfused" class="trigger">
          <option value="0">No</option>
          <option value="1">Yes, no turns yet</option>
          <option value="2">Yes, 1 turn</option>
          <option value="3">Yes, 2 turns</option>
          <option value="4">Yes, 3 turns</option>
          <option value="5">Yes, 4 turns (ends next check)</option>
        </select>
      </div>
      <div class="field-row">
        <label for="youSub" title="Substitute's remaining HP as % of your mon's max HP (a fresh one is 25%). 0 = none.">Substitute %</label>
        <input type="number" id="youSub" class="trigger" value="0" min="0" max="25" />
      </div>
    </div>
  </section>

  <!-- ───────────────────────── BATTLE + READOUT ───────────────────────── -->
  <section class="panel" id="battlePanel" aria-label="Battle">
    <h2>Battle</h2>
    <div class="field-row">
      <label for="challenge" title="Challenge 1 is battles 1-7 of your streak, challenge 2 battles 8-14, and so on. It decides which trainers (and so which teammates) you can meet.">Challenge</label>
      <select id="challenge" class="trigger"></select>
      <label for="battle" class="inline-label">Battle</label>
      <select id="battle" class="trigger"></select>
    </div>
    <div class="field-row" id="trainerRow">
      <label for="trainer" title="The trainer's name and class, as the game shows them before the battle. Their Pokémon come from that trainer's own pool, with one IV value. Leave empty to average over every trainer this battle can draw.">Trainer</label>
      <div class="combo-wrap"><input type="text" id="trainer" class="trigger combo-input" placeholder="Any (type a name)" autocomplete="off" /><div class="combo-list" id="trainerList"></div></div>
    </div>
    <div class="field-row">
      <label for="turn" title="The battle's turn number (1 = the first turn). The AI reads it.">Turn</label>
      <input type="number" id="turn" class="trigger" value="1" min="1" max="999" />
    </div>
    <div class="field-row">
      <label for="brain" title="Anabel, the Tower's Frontier Brain, is the 7th battle of challenge 5 (Silver, streak 35): picked for you there. Gold is streak 70 (inside 8+) and, with both symbols, every 35 after: pick her by hand.">Brain</label>
      <select id="brain" class="trigger">
        <option value="">No (a Frontier trainer)</option>
        <option value="Anabel Silver">Anabel, Silver</option>
        <option value="Anabel Gold">Anabel, Gold</option>
      </select>
    </div>

    <h3>Their next action</h3>
    <div id="oppChoices" class="choice-bars"></div>
    <div id="switchLine" class="progress"></div>
    <div id="notes" class="notes"></div>

    <h3>Your options this turn</h3>
    <table class="options-table" id="adviceTable">
      <thead><tr>
        <th title="Each thing you can do this turn, played out against everything it might do (the odds above), every damage roll, crit and miss counted.">Option</th>
        <th title="Chance one of their Pokémon that was out faints this turn">KO it</th>
        <th title="Chance one of your Pokémon faints this turn">You faint</th>
        <th title="Expected HP it loses this turn, in % of its max HP (summed over their Pokémon that were out)">Dealt</th>
        <th title="Expected HP you lose this turn, in % of the max HP of each of your Pokémon hit (a switch-in included)">Taken</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="adviceNote" class="progress"></div>

    <h3>Field</h3>
    <div class="field-row">
      <label for="weather">Weather</label>
      <select id="weather" class="trigger">
        <option value="">None</option>
        <option value="sun">Sun</option>
        <option value="rain">Rain</option>
        <option value="sandstorm">Sandstorm</option>
        <option value="hail">Hail</option>
      </select>
      <select id="weatherTurns" class="trigger" title="From an ability (Drizzle, Sand Stream...) weather never ends; from a move it lasts 5 turns.">
        <option value="">From an ability</option>
        <option value="5">5 turns left</option>
        <option value="4">4 turns left</option>
        <option value="3">3 turns left</option>
        <option value="2">2 turns left</option>
        <option value="1">1 turn left</option>
      </select>
    </div>
    <div class="two-col">
      <div>
        <div class="col-title">Your side</div>
        <div id="youSide"></div>
      </div>
      <div>
        <div class="col-title">Their side</div>
        <div id="oppSide"></div>
      </div>
    </div>
  </section>

  <!-- ───────────────────────── OPPONENT ───────────────────────── -->
  <section class="panel" id="oppPanel" aria-label="Opponent">
    <h2>Opponent</h2>
    <div class="field-row">
      <label for="oppSet">Out now</label>
      <div class="combo-wrap"><input type="text" id="oppSet" class="trigger combo-input" placeholder="Type to search sets…" autocomplete="off" /><div class="combo-list" id="oppSetList"></div></div>
    </div>
    <div class="field-row" id="bracketRow">
      <input type="checkbox" id="bracketOnly" class="trigger" checked /><label for="bracketOnly" class="chk-label">Only sets this challenge can have</label>
    </div>
    <div id="oppCard" class="set-card" hidden></div>
    <div id="candBlock" class="cand-block" hidden>
      <div class="col-title" title="Other sets of this species the trainer (or this battle's trainers) can have. Tick the ones it could still be; untick a set once it uses a move that set does not have. The odds are from the trainer draw.">Could be</div>
      <div id="candList"></div>
    </div>
    <div class="field-row" id="oppAbilityRow" hidden>
      <label for="oppAbility">Ability</label>
      <select id="oppAbility" class="trigger"></select>
    </div>
    <div class="field-row" id="oppGenderRow" hidden>
      <label for="oppGender" title="The ♂/♀ next to its name in battle. Only Attract and Cute Charm read it.">Gender</label>
      <select id="oppGender" class="trigger">
        <option value="">Unknown</option>
        <option value="male">Male ♂</option>
        <option value="female">Female ♀</option>
      </select>
    </div>
    <div class="field-row" id="oppIvRow" hidden>
      <label for="oppIv" title="Every Frontier trainer gives all its Pokémon one IV value; which trainer you met decides it.">IVs</label>
      <select id="oppIv" class="trigger"></select>
    </div>

    <div class="field-row">
      <label for="oppHp">HP %</label>
      <input type="number" id="oppHp" class="trigger" value="100" min="1" max="100" />
      <span class="hp-abs" id="oppHpAbs"></span>
    </div>
    <div id="oppStatusRows"></div>
    <div class="field-row">
      <label title="Leave all at 0 at the start: switch-in effects are applied for you.">Stages</label>
      <div class="stage-grid" id="oppStages"></div>
    </div>
    <div class="field-row">
      <label for="oppConfused">Confused</label>
      <select id="oppConfused" class="trigger">
        <option value="0">No</option>
        <option value="1">Yes, no turns yet</option>
        <option value="2">Yes, 1 turn</option>
        <option value="3">Yes, 2 turns</option>
        <option value="4">Yes, 3 turns</option>
        <option value="5">Yes, 4 turns (ends next check)</option>
      </select>
    </div>
    <div class="field-row">
      <input type="checkbox" id="oppItemGone" class="trigger" /><label for="oppItemGone" class="chk-label">Item used up</label>
    </div>
    <div class="field-row">
      <input type="checkbox" id="oppFirstTurn" class="trigger" checked /><label for="oppFirstTurn" class="chk-label" title="It was just sent out this turn. Its AI treats a first turn differently (Fake Out, for one).">First turn on the field</label>
    </div>

    <h3>Rest of their team</h3>
    <div class="field-row">
      <input type="checkbox" id="oppIsLead" class="trigger" checked /><label for="oppIsLead" class="chk-label" title="Their first Pokémon of the battle. Their team is drawn around it.">The one out is their lead</label>
    </div>
    <div class="field-row" id="leadRow" hidden>
      <label for="leadSet">Their lead</label>
      <div class="combo-wrap"><input type="text" id="leadSet" class="trigger combo-input" placeholder="Type to search sets…" autocomplete="off" /><div class="combo-list" id="leadSetList"></div></div>
      <input type="number" id="leadHp" class="trigger hp-small" value="100" min="0" max="100" title="Its HP % (0 = fainted)" />
    </div>
    <div class="field-row" id="other1Row">
      <label for="other1Set" title="Another of their Pokémon you have seen (it came in and left, or fainted).">Also seen</label>
      <div class="combo-wrap"><input type="text" id="other1Set" class="trigger combo-input" placeholder="None" autocomplete="off" /><div class="combo-list" id="other1SetList"></div></div>
      <input type="number" id="other1Hp" class="trigger hp-small" value="100" min="0" max="100" title="Its HP % (0 = fainted)" />
    </div>
    <div class="field-row" id="other2Row">
      <label for="other2Set">Also seen</label>
      <div class="combo-wrap"><input type="text" id="other2Set" class="trigger combo-input" placeholder="None" autocomplete="off" /><div class="combo-list" id="other2SetList"></div></div>
      <input type="number" id="other2Hp" class="trigger hp-small" value="100" min="0" max="100" title="Its HP % (0 = fainted)" />
    </div>
  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
